<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Side by Side Scripture mark</title>
<!--
  Channel mark, drawn in the stage's Vellum colors.
  ?v=a (monogram) or ?v=b (two columns), &size=150 (watermark) or 800 (profile picture),
  &shape=circle for the profile picture (YouTube crops it to a circle).
  Rendered to PNG by branding/render.sh.
-->
<style>
@font-face { font-family: "Source Serif 4"; src: url(../fonts/source-serif-4-latin-600-normal.woff2) format("woff2"); font-weight: 600; }
html, body { margin: 0; background: transparent; }
svg { display: block; }
</style>
</head>
<body>
<script>
const p = new URLSearchParams(location.search);
const v = p.get("v") || "a";
const size = +(p.get("size") || 150);
const circle = p.get("shape") === "circle";
const paper = "#F5F1E8", main = "#14110D", accent = "#6E2419", rule = "#CFC4B0";

// Drawn on a 100×100 grid, scaled to `size`.
const frame = circle
  ? `<rect width="100" height="100" fill="${paper}"/><circle cx="50" cy="50" r="46" fill="none" stroke="${accent}" stroke-width="5"/>`
  : `<rect x="3" y="3" width="94" height="94" rx="16" fill="${paper}" stroke="${accent}" stroke-width="6"/>`;
const marks = {
  // Two serif S's side by side, split by a rule, like the Full video layout.
  a: `${frame}
      <text x="29" y="68" font-family="Source Serif 4, Georgia, serif" font-weight="600" font-size="52" fill="${main}" text-anchor="middle">S</text>
      <line x1="50" y1="24" x2="50" y2="76" stroke="${accent}" stroke-width="3.5" stroke-linecap="round"/>
      <text x="71" y="68" font-family="Source Serif 4, Georgia, serif" font-weight="600" font-size="52" fill="${accent}" text-anchor="middle">S</text>`,
  // Two columns of text lines side by side.
  b: `${frame}
      ${[26, 38, 50, 62, 74].map((y, i) => `<line x1="18" y1="${y}" x2="${i === 4 ? 34 : 44}" y2="${y}" stroke="${main}" stroke-width="6" stroke-linecap="round"/>`).join("")}
      <line x1="50" y1="20" x2="50" y2="80" stroke="${rule}" stroke-width="2.5"/>
      ${[26, 38, 50, 62, 74].map((y, i) => `<line x1="57" y1="${y}" x2="${i === 4 ? 70 : 82}" y2="${y}" stroke="${accent}" stroke-width="6" stroke-linecap="round"/>`).join("")}`,
  // Illuminated initial: paper S on a dark red block, inner frame, diamond ornaments.
  c: (circle
      ? `<rect width="100" height="100" fill="${accent}"/><circle cx="50" cy="50" r="42" fill="none" stroke="${paper}" stroke-width="1.6"/>`
      : `<rect x="1" y="1" width="98" height="98" rx="16" fill="${accent}"/><rect x="9" y="9" width="82" height="82" rx="9" fill="none" stroke="${paper}" stroke-width="1.6"/>`) +
     ornaments(paper, 42) + initial(paper),
  // Illuminated initial, reversed: dark red S on paper inside a double-ruled frame.
  d: (circle
      ? `<rect width="100" height="100" fill="${paper}"/><circle cx="50" cy="50" r="46" fill="none" stroke="${accent}" stroke-width="5"/><circle cx="50" cy="50" r="39" fill="none" stroke="${accent}" stroke-width="1.4"/>`
      : `<rect x="3" y="3" width="94" height="94" rx="16" fill="${paper}" stroke="${accent}" stroke-width="6"/><rect x="12" y="12" width="76" height="76" rx="7" fill="none" stroke="${accent}" stroke-width="1.4"/>`) +
     ornaments(main, 39) + initial(accent),
  // Cross between two pages: the column divider is a cross, text lines on either side.
  e: `${frame}<g transform="${circle ? "translate(50 50) scale(0.82) translate(-50 -50)" : ""}">
      <rect x="47.5" y="15" width="5" height="70" fill="${accent}"/>
      <rect x="35" y="27" width="30" height="5" fill="${accent}"/>
      ${[45, 56, 67, 78].map((y, i) => `<line x1="17" y1="${y}" x2="${i === 3 ? 32 : 40}" y2="${y}" stroke="${main}" stroke-width="5" stroke-linecap="round"/>`).join("")}
      ${[45, 56, 67, 78].map((y, i) => `<line x1="60" y1="${y}" x2="${i === 3 ? 75 : 83}" y2="${y}" stroke="${main}" stroke-width="5" stroke-linecap="round"/>`).join("")}</g>`,
  // Bold Latin cross, paper on dark red, like the illuminated initial.
  f: (circle
      ? `<rect width="100" height="100" fill="${accent}"/><circle cx="50" cy="50" r="42" fill="none" stroke="${paper}" stroke-width="1.6"/>`
      : `<rect x="1" y="1" width="98" height="98" rx="16" fill="${accent}"/><rect x="9" y="9" width="82" height="82" rx="9" fill="none" stroke="${paper}" stroke-width="1.6"/>`) +
     ornaments(paper, 42) +
     `<rect x="43.5" y="20" width="13" height="62" fill="${paper}"/><rect x="28" y="34" width="44" height="13" fill="${paper}"/>`,
  // Four pages (one per translation); the gap between them forms a cross.
  g: (() => {
    const gap = 12, cx = 50, cy = 38; // Latin cross: crossbar above centre
    const lo = circle ? 23 : 15, hi = circle ? 77 : 85;
    const L = cx - gap / 2, R = cx + gap / 2, T = cy - gap / 2, B = cy + gap / 2;
    const pages = [[lo, lo, L, T], [R, lo, hi, T], [lo, B, L, hi], [R, B, hi, hi]];
    const lines = ([x0, y0, x1, y1]) => {
      const out = [];
      for (let y = y0 + 7; y <= y1 - 5; y += 8) out.push(`<line x1="${x0 + 5}" y1="${y}" x2="${x1 - 5}" y2="${y}" stroke="${accent}" stroke-width="2.4" stroke-linecap="round" opacity=".55"/>`);
      return out.join("");
    };
    const body = pages.map((p) => `<rect x="${p[0]}" y="${p[1]}" width="${p[2] - p[0]}" height="${p[3] - p[1]}" rx="3" fill="${paper}"/>` + lines(p)).join("");
    const bg = circle
      ? `<rect width="100" height="100" fill="${accent}"/><circle cx="50" cy="50" r="42" fill="none" stroke="${paper}" stroke-width="1.6"/>`
      : `<rect x="1" y="1" width="98" height="98" rx="16" fill="${accent}"/>`;
    return bg + body;
  })(),
};

// A large serif S, optically centred on the 100×100 grid.
function initial(color) {
  return `<text x="50" y="75" font-family="Source Serif 4, Georgia, serif" font-weight="600" font-size="74" fill="${color}" text-anchor="middle">S</text>`;
}
// Four small diamonds: in the corners of the square frame, or set on the inner ring at the diagonals.
function ornaments(color, ringR) {
  const o = ringR / Math.SQRT2;
  const pts = circle ? [[50 - o, 50 - o], [50 + o, 50 - o], [50 - o, 50 + o], [50 + o, 50 + o]] : [[19, 19], [81, 19], [19, 81], [81, 81]];
  return pts.map(([x, y]) => `<rect x="${x - 2.6}" y="${y - 2.6}" width="5.2" height="5.2" fill="${color}" transform="rotate(45 ${x} ${y})"/>`).join("");
}
document.body.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 100 100">${marks[v]}</svg>`;
</script>
</body>
</html>
